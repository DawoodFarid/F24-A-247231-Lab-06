
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lookup - Canteen</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Canteen</h1>
    </header>

    <main>
        <h2>The Lookup</h2>

        <p id="status">Ready to look up an item.</p>

        <section>
            <label for="item">Item name:</label>
            <input type="text" id="item">
            <button id="find">Find</button>
        </section>

        <section id="card">
            <h2 id="card-name"></h2>
            <p id="card-price"></p>
        </section>

        <section>
            <h2>The Slip</h2>
            <table>
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Price</th>
                        <th>Times</th>
                    </tr>
                </thead>
                <tbody id="slip"></tbody>
            </table>
        </section>

        <section>
            <p>Found: <span id="found">0</span></p>
            <p>Dearest: <span id="dearest">0</span></p>
        </section>
    </main>

    <footer>
        Roll Number: 247231
    </footer>

    <script src="script.js"></script>
</body>
</html>
